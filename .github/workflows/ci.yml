name: CI Test Suite

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: novarisk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:6
        ports:
          - 27017:27017

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Databases
        run: |
            echo "Waiting for PostgreSQL..."
            until pg_isready -h localhost -p 5432 -U postgres; do
              sleep 1
            done
            echo "PostgreSQL is up!"

      - name: Initialize Database Tables
        run: |
          python -c "from app.core.databases import Base, engine; from app.models.trade import Trade; from app.models.risk import PortfolioRiskLimit; Base.metadata.create_all(bind=engine)"

      - name: Run Pytest
        run: |
          pytest -v